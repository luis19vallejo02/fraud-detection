name: docker

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - run: python -m pip install -r requirements-api.txt pyyaml==6.0.4
      - name: Train on synthetic transactions
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import yaml

          config_path = Path('config.yaml')
          config = yaml.safe_load(config_path.read_text())
          config['xgboost'].update(n_estimators=12, early_stopping_rounds=3, n_jobs=1)
          config_path.write_text(yaml.safe_dump(config))
          data_path = Path(config['data_path'])
          data_path.parent.mkdir(parents=True, exist_ok=True)
          time = np.arange(300)
          fraud = (time % 11 == 0).astype(int)
          rng = np.random.default_rng(42)
          data = pd.DataFrame(rng.normal(size=(len(time), 28)), columns=[f'V{i}' for i in range(1, 29)])
          data['V1'] += fraud * 4
          data.assign(Time=time, Amount=(time % 30) + 1, Class=fraud).to_csv(data_path, index=False)
          PY
          python -m src.train
          python -m src.export_predictions
      - run: docker build -t fraud-api .
      - name: Verify health, OpenAPI and a prediction in the container
        run: |
          docker run --detach --name fraud-api -p 127.0.0.1:8000:8000 fraud-api
          trap 'docker logs fraud-api; docker rm -f fraud-api' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused http://127.0.0.1:8000/health > /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:8000/docs > /dev/null
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d @sample_request.json http://127.0.0.1:8000/predict > /tmp/prediction.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text())
          prediction = json.loads(Path('/tmp/prediction.json').read_text())
          assert health['status'] == 'ok'
          score = prediction['fraud_score']
          threshold = prediction['threshold']
          assert 0 <= score <= 1
          assert threshold == health['threshold']
          assert prediction['is_fraud_alert'] is (threshold is not None and score >= threshold)
          PY
